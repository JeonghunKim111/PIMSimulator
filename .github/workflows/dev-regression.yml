name: PIMSimulator dev regression

on:
  push:
    branches:
      - dev
      - dev-stage2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential scons libgtest-dev

      - name: Build
        run: scons -j2

      - name: Run self-contained CSC regression
        run: >-
          ./sim
          --gtest_filter=CSCM6IntegrationTest.*:CSCM6SchedulingComparisonTest.*:CSCM7BEndToEndTest.*:SpmvDrafBgaStructuralCommonTest.*
